[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "markii"
version = "0.1.0"
description = "PixelPost Mark II — archaeology, import, and restoration toolkit"
requires-python = ">=3.9"
dependencies = [
    "flask>=3.0",
]

[project.scripts]
markii = "markii.cli.main:main"
pixelpostii = "pixelpostii.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["markii*", "pixelpostii*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
